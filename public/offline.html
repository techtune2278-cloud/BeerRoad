<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e3cf">
  <title>La Beer Road — hors connexion</title>
  <style>
    :root{color-scheme:light;--paper:#f2ead6;--green:#294e39;--amber:#dba64c;--ink:#342f27}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
    main{max-width:460px;text-align:center;padding:30px 24px;border:1px solid #d8cfb7;border-radius:28px;background:#fffdf6;box-shadow:0 16px 44px #294e3918}
    img{width:92px;height:92px}h1{color:var(--green);font-size:1.8rem;margin:16px 0 8px}p{margin:0 0 18px}button{border:0;border-radius:999px;padding:12px 20px;background:var(--green);color:white;font-weight:700;font-size:1rem;cursor:pointer}
  </style>
</head>
<body><main>
  <img src="/icon-192.png" alt="">
  <h1>La Beer Road</h1>
  <p>Tu es actuellement hors connexion. Les pages publiques déjà chargées peuvent parfois rester disponibles, mais le carnet, l'agenda et la connexion ont besoin d'Internet pour synchroniser les données de la famille.</p>
  <button onclick="location.reload()">Réessayer</button>
</main></body>
</html>
